<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StandardWasm interactive console</title></head>
<body>
<main>
<h1>Run a compiled .NET console app with standard input</h1>
<label>Choose files <input id="files" type="file" multiple></label>
<label>Choose publish folder <input id="folder" type="file" webkitdirectory></label>
<fieldset>
<legend>Process</legend>
<label>Arguments as a JSON string array <input id="arguments" value="[]" spellcheck="false"></label>
<label>Console encoding <select id="encoding">
<option value="utf-8">UTF-8</option>
<option value="windows-1252">Windows-1252</option>
</select></label>
<label>Line terminator <select id="newline">
<option value="crlf">CRLF (Windows)</option>
<option value="lf">LF</option>
</select></label>
</fieldset>
<button id="run" type="button" disabled>Run managed entry</button>
<section aria-label="Console">
<pre id="stdout" aria-live="polite"></pre>
<pre id="stderr" aria-live="polite"></pre>
<details><summary>Stream order</summary><pre id="transcript">[]</pre></details>
<form id="input-form">
<label>Standard input <input id="input" autocomplete="off" spellcheck="false" disabled></label>
<button id="send" type="submit" disabled>Send line</button>
<button id="eof" type="button" disabled>End of input</button>
</form>
<p>Page timer ticks: <output id="ticks">0</output></p>
</section>
<pre id="status" role="status" aria-live="polite"></pre>
</main>
<script type="module" src="/stage-151-interactive-stdin/web/stdin-ui.mjs"></script>
</body>
</html>
